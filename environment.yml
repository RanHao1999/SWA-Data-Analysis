# Conda environment for the Alpha Processing GMM pipeline
# =======================================================
# Curated from the working environment `research_env`
# (python 3.10.16, linux-64) on 2026-08-19.
#
# Create the environment:
#   conda env create -f environment.yml
#   conda activate GMM_env
#
# Notes:
#  * Versions are pinned to the versions the pipeline was tested with.
#    If a pin fails to resolve on your OS, relax that line (e.g. change
#    "=1.15.1" to ">=1.15.1") and rerun.
#  * The code is tested with numpy 1.26 — it is NOT verified under numpy 2.x.
#  * mpi4py + openmpi are commented out: only needed for the MPI-based scripts
#    under Miscellany/. The main pipeline uses stdlib concurrent.futures.
#  * spacepy / sunpy / sunpy-soar / cdflib are only imported by
#    Cal_Moments_From_VDF.py and sunpy_soar_download.py (SOAR data download);
#    the core GMM fitting code does not need them.
name: GMM_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.16
  - numpy=1.26.4
  - scipy=1.15.1
  - pandas=2.3.1
  - scikit-learn=1.6.1
  - astropy=6.1.3
  - h5py=3.12.1
  - netcdf4=1.7.2
  - pytables=3.10.1
  - pyarrow=19.0.0
  - imageio=2.37.0
  - imageio-ffmpeg=0.6.0
  - jupyter=1.1.1
  # - mpi4py=3.1.3        # optional: MPI scripts only
  # - openmpi=4.1.3
  - pip
  - pip:
      - matplotlib==3.10.3
      - seaborn==0.13.2
      - xarray==2025.6.1
      - cdflib==1.3.8
      - tqdm==4.67.1
      - spacepy==0.7.0
      - sunpy==6.0.6
      - sunpy-soar==1.11.1
